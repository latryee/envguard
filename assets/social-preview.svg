<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Shield Icon Graphic -->
  <g transform="translate(100, 190) scale(1.4)">
    <path d="M 60 10 L 110 30 L 110 85 C 110 125 60 155 60 155 C 60 155 10 125 10 85 L 10 30 Z" fill="url(#shieldGrad)" opacity="0.2" />
    <path d="M 60 10 L 110 30 L 110 85 C 110 125 60 155 60 155 C 60 155 10 125 10 85 L 10 30 Z" fill="none" stroke="url(#accent)" stroke-width="4" />
    <path d="M 42 78 L 54 90 L 80 62" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Subtitle -->
  <text x="320" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#accent)" letter-spacing="-1.5">envguard</text>
  
  <text x="320" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Zero-Config Git Secret Leaks &amp; Type Validator</text>

  <!-- Feature Pills -->
  <g transform="translate(320, 340)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" />
      <text x="90" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">🛡️ Secret Leaks</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#334155" />
      <text x="95" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#a78bfa" text-anchor="middle">⚡ Type Validation</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(400, 0)">
      <rect width="200" height="42" rx="21" fill="#1e293b" stroke="#334155" />
      <text x="100" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle">🔄 Auto .env.example</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(615, 0)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" />
      <text x="85" y="26" font-family="-apple-system, sans-serif" font-size="16" font-weight="600" fill="#fbbf24" text-anchor="middle">🪝 Pre-Commit</text>
    </g>
  </g>

  <!-- Terminal Snippet Bar -->
  <g transform="translate(320, 425)">
    <rect width="780" height="90" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="30" cy="45" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="50" cy="45" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="70" cy="45" r="6" fill="#10b981" opacity="0.8" />
    <text x="105" y="52" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="22" font-weight="600" fill="#38bdf8">$ npx envguard</text>
    <text x="270" y="52" font-family="'Fira Code', Consolas, Monaco, monospace" font-size="20" font-weight="400" fill="#64748b">— Zero-config drift check &amp; entropy scan</text>
  </g>

  <!-- Footer Tagline -->
  <text x="600" y="585" font-family="-apple-system, sans-serif" font-size="16" font-weight="500" fill="#475569" text-anchor="middle">Open Source • TypeScript • Multi-Language AST • 100% Offline</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <linearGradient id="hookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="hookShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <g filter="url(#hookShadow)">
    <rect x="20" y="20" width="860" height="320" rx="12" fill="url(#hookGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title Bar -->
    <path d="M 20 32 C 20 25.37 25.37 20 32 20 L 868 20 C 874.63 20 880 25.37 880 32 L 880 56 L 20 56 Z" fill="#0b1120" />
    <circle cx="45" cy="38" r="5" fill="#ef4444" />
    <circle cx="62" cy="38" r="5" fill="#f59e0b" />
    <circle cx="79" cy="38" r="5" fill="#10b981" />
    <text x="450" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Git Pre-Commit Hook Interception</text>

    <!-- Terminal Content -->
    <g font-family="'Fira Code', Consolas, Monaco, monospace" font-size="13">
      <!-- Installation -->
      <text x="50" y="90" fill="#94a3b8"><tspan fill="#34d399">➜</tspan> <tspan fill="#38bdf8">npx envguard hook install</tspan></text>
      <text x="50" y="112" fill="#10b981">✔ Installed EnvGuard pre-commit hook in .git/hooks/pre-commit.</text>

      <!-- Interception on Git Commit -->
      <text x="50" y="152" fill="#94a3b8"><tspan fill="#34d399">➜</tspan> <tspan fill="#f1f5f9">git commit -m "add stripe billing logic"</tspan></text>
      <text x="50" y="180" fill="#f87171" font-weight="700">🚨 [envguard] CRITICAL: SECRET LEAK DETECTED IN STAGED FILES</text>
      <text x="50" y="202" fill="#f87171">  ● <tspan font-weight="700">Stripe Secret Key</tspan> in .env.example:12</text>
      <text x="50" y="222" fill="#94a3b8">    Masked: <tspan fill="#fbbf24">sk_live_...9xY2</tspan> (Shannon Entropy: 4.82)</text>
      <text x="50" y="242" fill="#38bdf8">    Fix: Run 'npx envguard sync' to automatically mask keys before committing.</text>
      
      <line x1="50" y1="262" x2="830" y2="262" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3" />
      <text x="50" y="286" fill="#ef4444" font-weight="700">❌ Git commit aborted by EnvGuard pre-commit hook. (0 secrets leaked to Git)</text>
    </g>
  </g>
</svg>
